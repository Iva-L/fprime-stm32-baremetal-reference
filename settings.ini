config_directory: ./FprimeStm32BaremetalReference/config
library_locations: ./lib/fprime-baremetal:./lib/fprime-sensors:./lib/fprime-stm32

default_cmake_options:  FPRIME_ENABLE_FRAMEWORK_UTS=OFF
                        FPRIME_ENABLE_AUTOCODER_UTS=OFF
